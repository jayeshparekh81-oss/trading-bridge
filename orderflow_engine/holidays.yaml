# NSE trading holidays — used by the recorder scheduler to skip sessions.
#
# Official NSE 2026 equity-segment trading holidays. Cross-verified across two
# independent published lists (ClearTax, Groww) and every weekday was validated
# programmatically. Source of truth: NSE circular / nseindia.com "Market Timings
# & Holidays". Weekends are skipped automatically and are NOT listed here.
#
# Re-verified 2026-07-11 (R1 build) against the ClearTax NSE-2026 list: all 16
# weekday entries below confirmed correct. In particular 2026-01-15 IS a genuine
# NSE trading holiday — NSE declared it a Capital-Market trading holiday on
# 2026-01-12 for the Maharashtra (BMC + 28 corporations) municipal elections,
# revising an earlier "settlement-holiday only" notice. Do NOT drop it.
#
# Note: Sun 2026-11-08 (Diwali Laxmi Pujan) has a special *Muhurat* evening
# session — it is a Sunday (auto-skipped) and R0 does not record the Muhurat
# window, so it is intentionally NOT listed as a holiday.
#
# Fail-safe reminder: UNDER-listing is now harmless on BOTH counts — the recorder
# connects on a closed day and records nothing, AND (2026-07-17 fix) the G0 counter
# SKIPS a no-session day (~0% coverage) so an unlisted/unscheduled holiday no longer
# silently resets the clean-session streak (see alerts/pulse.py::_no_session). OVER-
# listing is still dangerous: marking a real trading day as a holiday skips the session
# and loses it forever — so the one job of this list is DON'T list a real trading day.
# Cross-checked 2026-07-17 vs ClearTax: all 6 remaining-2026 entries (Sep→Dec) correct.
# Re-verify against the official NSE 2027 circular next year (Sunday-ritual refresh).
#
# Format: ISO dates (YYYY-MM-DD) under `holidays`.

holidays:
  - 2026-01-15   # Thu — Municipal Corporation Election (Maharashtra)
  - 2026-01-26   # Mon — Republic Day
  - 2026-03-03   # Tue — Holi
  - 2026-03-26   # Thu — Shri Ram Navami
  - 2026-03-31   # Tue — Shri Mahavir Jayanti
  - 2026-04-03   # Fri — Good Friday
  - 2026-04-14   # Tue — Dr. Baba Saheb Ambedkar Jayanti
  - 2026-05-01   # Fri — Maharashtra Day
  - 2026-05-28   # Thu — Bakri Id
  - 2026-06-26   # Fri — Muharram
  - 2026-09-14   # Mon — Ganesh Chaturthi
  - 2026-10-02   # Fri — Mahatma Gandhi Jayanti
  - 2026-10-20   # Tue — Dussehra (Vijaya Dashami)
  - 2026-11-10   # Tue — Diwali Balipratipada
  - 2026-11-24   # Tue — Prakash Gurpurb Sri Guru Nanak Dev
  - 2026-12-25   # Fri — Christmas
