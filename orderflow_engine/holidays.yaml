# NSE trading holidays — used by the recorder scheduler to skip sessions.
#
# Official NSE 2026 equity-segment trading holidays. Cross-verified across two
# independent published lists (ClearTax, Groww) and every weekday was validated
# programmatically. Source of truth: NSE circular / nseindia.com "Market Timings
# & Holidays". Weekends are skipped automatically and are NOT listed here.
#
# Note: Sun 2026-11-08 (Diwali Laxmi Pujan) has a special *Muhurat* evening
# session — it is a Sunday (auto-skipped) and R0 does not record the Muhurat
# window, so it is intentionally NOT listed as a holiday.
#
# Fail-safe reminder: under-listing is harmless (recorder connects on a closed
# day and records nothing); listing a real trading day would skip a session and
# lose it forever. Re-verify against the official NSE 2027 circular next year.
#
# Format: ISO dates (YYYY-MM-DD) under `holidays`.

holidays:
  - 2026-01-15   # Thu — Municipal Corporation Election (Maharashtra)
  - 2026-01-26   # Mon — Republic Day
